# Gera o masterseg-agente.exe automaticamente num Windows do GitHub.
# Actions > "Agente Windows" > Run workflow; o .exe sai em "Artifacts".
name: Agente Windows
on:
  workflow_dispatch:
  push:
    paths: ["agente/**"]
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Gerar executavel
        working-directory: agente
        run: |
          pip install -r requirements.txt pyinstaller librouteros
          pyinstaller --noconfirm --clean --onefile --name masterseg-agente --hidden-import librouteros --collect-submodules drivers agente.py
          copy dist\masterseg-agente.exe windows\
      - uses: actions/upload-artifact@v4
        with:
          name: masterseg-agente-windows
          path: agente/windows/
